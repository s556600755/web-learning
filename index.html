<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Day 1</title>
</head>
<body>
  <ul id="list"></ul>

  <script>
  async function loadUsers() {
    const res = await fetch("https://jsonplaceholder.typicode.com/users");
    const users = await res.json();

    const list = document.getElementById("list");
    users.forEach(user => {
      list.innerHTML += `<li>${user.name}（${user.email}）</li>`;
    });
  }

  loadUsers();
  </script>
</body>
</html>

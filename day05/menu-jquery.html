<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 4 - 菜單</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <span class="navbar-brand">台南小吃店</span>
            <span class="text-white">購物車：<span id="cartCount">0</span> 項</span>
        </div>
    </nav>

    <div class="container my-4">
        <h1 class="mb-4">今日菜單</h1>

        <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">牛肉湯</h5>
                        <p class="card-text">溫體牛肉，清甜湯頭</p>
                        <p class="fw-bold text-danger">$120</p>
                        <button class="btn btn-primary w-100">加入訂單</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">碗粿</h5>
                        <p class="card-text">古早味米漿蒸製</p>
                        <p class="fw-bold text-danger">$40</p>
                        <button class="btn btn-primary w-100">加入訂單</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">肉燥飯</h5>
                        <p class="card-text">滷汁香濃，配菜脯</p>
                        <p class="fw-bold text-danger">$35</p>
                        <button class="btn btn-primary w-100">加入訂單</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">蝦捲</h5>
                        <p class="card-text">鮮蝦豬肉，酥炸金黃</p>
                        <p class="fw-bold text-danger">$60</p>
                        <button class="btn btn-primary w-100">加入訂單</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(function () {
            let count = 0;

            $(".btn-primary").on("click", function () {
                count++;
                $("#cartCount").text(count);

                const name = $(this).closest(".card").find(".card-title").text();
                $(this).text("已加入 " + name).prop("disabled", true);
            });
        });
    </script>
</body>

</html>

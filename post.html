<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Day 3 - POST</title>
</head>
<body>
  <input id="title" placeholder="標題">
  <textarea id="content" placeholder="內容"></textarea>
  <button id="sendBtn">送出</button>
  <p id="result"></p>

  <script>
  const btn = document.getElementById("sendBtn");
  const result = document.getElementById("result");

  async function sendPost() {
    const data = {
      title: document.getElementById("title").value,
      body: document.getElementById("content").value,
      userId: 1
    };

    try {
      const res = await fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      if (!res.ok) {
        throw new Error("伺服器回應錯誤：" + res.status);
      }

      const saved = await res.json();
      result.textContent = `送出成功！編號：${saved.id}，狀態碼：${res.status}`;

    } catch (error) {
      result.textContent = "送出失敗：" + error.message;
    }
  }

  btn.addEventListener("click", sendPost);
  </script>
</body>
</html>
